  <script>
    function switchTab(role) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active', 'border-blue-600', 'border-purple-600', 'border-pink-600',
          'text-blue-700', 'text-purple-700', 'text-pink-700');
        b.classList.add('border-transparent', 'text-gray-500');
      });

      const pane = document.getElementById('pane-' + role);
      if (pane) pane.classList.add('active');

      const btn = document.querySelector('[data-tab="' + role + '"]');
      if (btn) {
        const colorMap = {dev: 'blue', pm: 'purple', art: 'pink'};
        const c = colorMap[role];
        btn.classList.remove('border-transparent', 'text-gray-500');
        btn.classList.add('active', 'border-' + c + '-600', 'text-' + c + '-700');
      }
    }
  </script>
